# Default account created in the rootfs by build_iso.sh.
# CHAKRA_USER_PASSWORD is intentionally absent — the build script prompts
# for it interactively so no credential is ever written to this repo.
#
# Groups:
#   sudo — administrative access (this is a single-operator pentest OS).
#   adm  — read access to /var/log (incl. the journal and /var/log/audit),
#          and, via chakra-core's 2770 root:adm /var/log/chakra/audit, the
#          ability to append to the Chakra Audit trail. Without adm the
#          read-only Chakra system API tools (chakra-loglens --source
#          security) and chakra-audit-log silently no-op when Sentinel /
#          Vault / Sandbox are run without sudo — which is their normal
#          invocation path (the menu launchers run as this user).
CHAKRA_USERNAME=chakra
CHAKRA_USER_GROUPS=sudo,adm
