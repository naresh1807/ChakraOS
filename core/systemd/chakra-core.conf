# Chakra OS core filesystem layout (chakra-core).
# systemd-tmpfiles(5) format -- declared once here, applied by
# systemd-tmpfiles-setup.service on every boot, so the layout is
# self-healing even if something under it gets wiped.
#
# See core/filesystem/README.md for what belongs in each directory.
#
# Type Path                    Mode User Group Age
d      /etc/chakra              0755 root root  -
d      /etc/chakra/policy.d     0755 root root  -
d      /usr/lib/chakra          0755 root root  -
d      /usr/share/chakra        0755 root root  -
# /var/lib/chakra itself is world-traversable (0755) -- the sensitive
# state lives one level down: vaults/ stays root-only (chakra-vault
# creates it 0700), shield/ is adm-readable for `chakra-shield status`.
d      /var/lib/chakra          0755 root root  -
d      /var/lib/chakra/shield   2750 root adm   -
#
# /var/log/chakra: adm-readable (2750, setgid so the tree stays group adm).
# /var/log/chakra/audit: adm-WRITABLE (2770) so the unprivileged desktop
#   user -- a member of adm -- can append to the Chakra Audit trail when
#   Sentinel/Vault/Sandbox run without sudo. Group-write means an adm
#   member could also rewrite the file; a tamper-evident trail (append-only
#   attr, or a privileged writer daemon) is future work -- see
#   core/security/README.md.
# The sentinel.jsonl file is pre-created 0664 root:adm so the first append
#   (whether by root via sudo or by the adm user) doesn't fix its mode to
#   something the other can't write.
d      /var/log/chakra          2750 root adm   -
d      /var/log/chakra/audit    2770 root adm   -
f      /var/log/chakra/audit/sentinel.jsonl 0664 root adm -
