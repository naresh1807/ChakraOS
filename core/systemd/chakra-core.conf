# Chakra OS core filesystem layout (chakra-core).
# systemd-tmpfiles(5) format -- declared once here, applied by
# systemd-tmpfiles-setup.service on every boot, so the layout is
# self-healing even if something under it gets wiped.
#
# See core/filesystem/README.md for what belongs in each directory.
#
# Type Path                    Mode User Group Age
d      /etc/chakra              0755 root root  -
d      /etc/chakra/policy.d     0755 root root  -
d      /usr/lib/chakra          0755 root root  -
d      /usr/share/chakra        0755 root root  -
d      /var/lib/chakra          0750 root root  -
d      /var/log/chakra          0750 root adm   -
