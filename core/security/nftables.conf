#!/usr/sbin/nft -f
# Chakra OS default firewall ruleset.
#
# This is a security-testing platform, so OUTBOUND stays permissive:
# nmap, sqlmap, hydra, aircrack-ng, msfconsole reverse shells, etc. all
# need arbitrary outbound connections to do their job. This hardens
# INBOUND only -- default-deny, with the minimum let back in for the OS
# to function normally on a network.
#
# Installed to /etc/nftables.conf, read by nftables.service by default.

flush ruleset

table inet chakra_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP: ping and path-MTU discovery
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # DHCP client replies -- stateless UDP, not always recognized as
        # "related" to the request without this, which would silently
        # break networking on most Wi-Fi/Ethernet connections.
        udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
