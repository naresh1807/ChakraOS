# Chakra OS kernel/network hardening.
# Installed to /etc/sysctl.d/60-chakra-hardening.conf.
#
# Deliberately does NOT touch kernel.yama.ptrace_scope. This OS ships
# gdb/strace/ltrace as core reverse-engineering tools (Security Tools
# menu, category 09) that routinely need to attach to arbitrary
# processes, not just their own children. Restricting ptrace here would
# break the very toolkit this OS exists to provide -- a hardening
# setting that fights the product's own purpose isn't hardening.

# Hide kernel pointers from unprivileged users (dmesg, /proc/kallsyms)
kernel.kptr_restrict = 2

# Restrict dmesg to CAP_SYSLOG
kernel.dmesg_restrict = 1

# Reverse-path filtering: drop packets whose source doesn't match the
# route back to it (basic anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# SYN cookies: mitigate basic SYN-flood DoS
net.ipv4.tcp_syncookies = 1

# Don't accept ICMP redirects (mitigates basic MITM via forged ICMP)
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Ignore broadcast ICMP (mitigates smurf-style amplification)
net.ipv4.icmp_echo_ignore_broadcasts = 1
