# Chakra OS usbguard-daemon override. Installed to /etc/usbguard/usbguard-daemon.conf.
# See core/security/usbguard/README.md for the full policy rationale.

RuleFile=/etc/usbguard/rules.conf
ImplicitPolicyTarget=block
PresentDevicePolicy=allow
PresentControllerPolicy=allow
InsertedDevicePolicy=block
RestoreControllerDeviceState=false
DeviceManagerBackend=uevent
IPCAllowedUsers=root
IPCAllowedGroups=root sudo
IPCAccessControlFiles=/etc/usbguard/IPCAccessControl.d/
# USB authorization events go to the kernel audit subsystem -> auditd ->
# /var/log/audit/audit.log, which is exactly what `chakra-loglens
# --source security` (and therefore Chakra Sentinel) already read. So a
# blocked device insertion shows up in Chakra's own security view with
# no extra wiring.
AuditBackend=LinuxAudit
# Only consulted if AuditBackend is switched to FileAudit; kept at
# usbguard's own default path (not a /var/log/chakra/ path, which would
# wrongly imply this backend feeds the Chakra trail -- it doesn't).
AuditFilePath=/var/log/usbguard/usbguard-audit.log
